name: GitHub Pages

on:
  push:
    branches:
      - main
      - refactor/web-directory
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out site source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /web/
      - name: Install locked Ruby dependencies
        uses: ruby/setup-ruby@8aeb6ff8030dd539317f8e1769a044873b56ea71 # v1.268.0
        env:
          BUNDLE_FROZEN: "true"
        with:
          ruby-version: "3.3.8"
          bundler: "2.6.7"
          bundler-cache: true
          working-directory: web
      - name: Build Jekyll
        working-directory: web
        env:
          BUNDLE_FROZEN: "true"
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/rf-pages"
      - name: Preserve published research paths
        run: python3 .github/pages/publish_research.py "$RUNNER_TEMP/rf-pages"
      - name: Verify public paths
        run: python3 .github/pages/verify_site.py "$RUNNER_TEMP/rf-pages"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/rf-pages

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: rf-pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
