<div class="table-scroll" tabindex="0" role="region" aria-label="候補管理の手法と適用範囲"><table><thead><tr><th scope="col">手法</th><th scope="col">主な制御対象</th><th scope="col">適用作品・観測範囲と限界</th></tr></thead><tbody><tr><th scope="row"><a href="rf5-4000-trials.html">多積み</a></th><td>目的候補の数を増やす</td><td>RF5では対象条件の4,000回試行。積み数を増やせば全条件で同じ倍率になるとは限らない。</td></tr><tr><th scope="row"><a href="cushion-method.html">クッション</a></th><td>内部参照と不要候補の発生を制御する</td><td>具体例はRF5の靴。内部が空・追加3枠などの条件を確認し、他作品・全レシピへ一般化しない。</td></tr><tr><th scope="row"><a href="dummy-method.html">ダミー</a></th><td>候補構成とRF4SPの選択特性を利用する</td><td>RF4SPの対象条件。ダミー脱落や内部式・改善率を保証しない。</td></tr><tr><th scope="row"><a href="shuffle-method.html">シャッフル</a></th><td>投入順を変更し、参照結果の変化を利用する</td><td>RF5の順序依存の観測例。内部アルゴリズムを確定せず、作品・レシピごとに確認。</td></tr></tbody></table></div>
