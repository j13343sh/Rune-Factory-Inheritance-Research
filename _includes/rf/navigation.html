<nav aria-label="分野から読む"><p class="nav-label">GUIDE INDEX</p>{% for section in site.data.rf_sections %}{% if section.kind == 'category' and section.public %}<details {% if current.category == section.id %}open{% endif %}><summary><a href="{{ '/fields/' | append: section.slug | append: '.html' | relative_url }}">{{ section.category_title }}</a></summary><ul>{% for g in site.data.rf_guides %}{% if g.category == section.id and g.public %}<li><a href="{{ '/guides/' | append: g.slug | append: '.html' | relative_url }}" {% if page.slug == g.slug %}aria-current="page"{% endif %}>{{ g.title }}</a></li>{% endif %}{% endfor %}</ul></details>{% endif %}{% endfor %}</nav>
