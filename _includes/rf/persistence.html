<figure class="auto-figure"><figcaption>観測と説明モデル：生成時と、確定後の扱いを区別する</figcaption><ol class="persistence-flow"><li><strong>生成</strong><p>必須素材由来のオートアレンジが生まれる。</p></li><li><strong>確定・保持</strong><p>完成装備の内部アレンジになる。由来が自動生成でも、その装備の保持情報として残る。</p></li><li><strong>後続製作で参照</strong><p>その装備を素材として使い、参照条件を満たすと、保持情報が後の結果へ関わる。</p></li><li><strong>他候補との競合</strong><p>本体や追加素材などと、最終的な保持3枠を取り合う可能性がある。</p></li></ol><p class="small">後続の参照条件や選択処理を省略した理解のための図です。内部保存形式・処理順の証明ではありません。生成時の非混入から、すでに保持された情報まで競合しないとは判断しません。</p></figure>
