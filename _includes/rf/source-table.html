{% assign data = site.data.rf_friendship[include.work] %}{% assign table = data.tables[include.index] %}<div class="table-scroll" tabindex="0" role="region" aria-label="{{ include.title | escape }}。横にスクロールできます"><table class="source-guide-table" data-source-work="{{ include.work }}" data-source-table="{{ table.number }}"><thead><tr>{% for header in include.headers %}<th scope="col">{{ header }}</th>{% endfor %}</tr></thead><tbody>{% for row in table.rows %}<tr data-source-line="{{ row.source_line }}">{% for cell in row.cells %}<td>{{ cell | escape }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div>
