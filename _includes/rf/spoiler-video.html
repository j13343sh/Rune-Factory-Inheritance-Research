{% assign clip = site.data.rf_videos | where: 'id', include.id | first %}{% if clip %}<section class="spoiler-video" data-spoiler-video data-media-src="{{ clip.path | relative_url }}" aria-label="ネタバレ警告付き動画"><h3>実演動画を見る前に</h3><p class="spoiler-warning"><strong>重大なストーリーネタバレがあります。</strong> {{ clip.warning | escape }}</p><p>この実演は救出の一例です。ポイント稼ぎの反復全工程を証明する動画ではありません。</p><button type="button" data-video-toggle aria-expanded="false" aria-controls="video-{{ clip.id }}">警告を理解して動画を表示</button><div id="video-{{ clip.id }}" data-video-mount hidden></div><p data-video-status role="status" aria-live="polite">動画はまだ読み込まれていません。</p><noscript><p>上の警告を確認したうえで、<a href="{{ clip.path | relative_url }}">実演動画を明示的に開く</a>ことができます。</p></noscript></section>{% endif %}
