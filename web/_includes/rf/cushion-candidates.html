<figure class="auto-figure"><figcaption>他の候補が発生しない条件での候補集合比較</figcaption><div class="auto-panels"><section><h3>通常例：ロケットを先頭</h3><ol><li>ロケットウィング：内部A・B</li><li>ゴーストブーツ：内部C・D</li></ol><div class="tokens">{% for item in site.data.rf_candidate_examples.first_reference %}{% if item.candidate %}<span class="token{% if item.origin == '先頭の内部' %} noise{% endif %}">{{ item.label }}{% if item.origin == '先頭の内部' %}（目的外X）{% endif %}</span>{% endif %}{% endfor %}</div><p><strong>4候補 → 3枠。競合あり。</strong> 後続の内部C・Dは参照しない。</p></section><section><h3>クッション：空レザーを先頭</h3><ol><li>内部が空のレザーブーツ</li><li>ロケットウィング</li><li>ゴーストブーツ</li></ol><div class="tokens">{% for item in site.data.rf_candidate_examples.cushion %}<span class="token">{{ item.label }}</span>{% endfor %}</div><p><strong>3候補 → 3枠。候補選択の競合を解消。</strong> 後続2足の不要な内部情報を参照しない。</p></section></div><p class="small">3足を追加投入できるベースレシピが必要です。内部が空であること、他の候補が発生しないことが前提で、全工程の成功や効果発現を無条件に保証する図ではありません。</p></figure>
